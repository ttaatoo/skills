name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          node scripts/extract-changelog.js "$TAG" > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "No CHANGELOG section for ${TAG}; using generated notes."
            echo "USE_GENERATE=1" >> "$GITHUB_ENV"
          else
            echo "USE_GENERATE=0" >> "$GITHUB_ENV"
            echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping create."
            exit 0
          fi
          if [[ "${USE_GENERATE}" == "1" ]]; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          fi
